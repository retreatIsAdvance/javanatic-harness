name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # validate 阶段内置 spotless:check + checkstyle:check，与本地 pre-push 同口径
      - name: Build and test
        run: mvn -B -ntp package
