name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # 前置硬门：bwrap 必须能跑且必须真拒写。探针通过后，单测里的
      # assumeTrue(bwrapUsable()) 在 CI 不可达——跳过即静默绿，这里先挡掉。
      # 失败时按 it12.7 风险阶梯调 AppArmor 旋钮重试；仍失败则红（不静默吞）。
      - name: "Pre-flight sandbox probe (bwrap: runnable and denying)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          probe() { bwrap --ro-bind / / --dev /dev --die-with-parent -- true; }
          if ! probe; then
            echo "::warning::bwrap probe failed — disabling AppArmor unprivileged-userns restriction and retrying"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          probe
          if bwrap --ro-bind / / --dev /dev --die-with-parent -- bash -c 'echo x > /tmp/bwrap-ci-probe.txt' 2>/dev/null; then
            echo "::error::bwrap did not deny a read-only write — refusing to test on an ineffective sandbox"
            exit 1
          fi
      # docker Provider e2e（it12.5）需要 daemon（runner 自带）与测试镜像在场。
      # 测试常量 agent-runner:latest 是本地 docker.io 不可达时的替代拼写；CI 用
      # docker.io 的 ubuntu:24.04 打同名 tag——同一能力面（bash + setsid）。
      # 插件「镜像缺失 fail loud」契约不变：这里不预置，测试就会如实报错。
      - name: Provision docker test image
        run: |
          docker pull -q ubuntu:24.04
          docker tag ubuntu:24.04 agent-runner:latest
          docker run --rm --entrypoint sh agent-runner:latest \
            -c 'for c in bash setsid sleep; do command -v "$c" || exit 1; done'
      # validate 阶段内置 spotless:check + checkstyle:check，与本地 pre-push 同口径
      - name: Build and test
        run: mvn -B -ntp package
      # 前置硬门 2（it24）：landlock 助手必须在本 runner 内核上真跑通——同 bwrap 门之理，
      # 否则下面两条 assumeTrue(landlockUsable()) 的 e2e 会静默跳过。走 jlink 镜像的模块
      # 形态真跑助手 --probe（真建 ruleset + 真拒写 + 真 exec），非 0 即红；结论行原样入日志。
      # JVM 参数与文档化的助手启动形态一致（HelperLaunch / 05 §6：-XX:-UsePerfData +
      # -Dstderr.encoding=UTF-8 + --enable-native-access）——手搓命令不得与产品启动面漂移。
      - name: "Pre-flight sandbox probe (landlock: runnable and denying)"
        run: |
          set -o pipefail
          img=dist/jh/target/jlink-image
          "$img/bin/java" -XX:-UsePerfData -Dstderr.encoding=UTF-8 \
            --enable-native-access=io.javanatic.harness.sandbox.local \
            -m io.javanatic.harness.sandbox.local/io.javanatic.harness.sandbox.local.LandlockExecMain \
            --probe 2>&1 | tee "$RUNNER_TEMP/landlock-probe.txt"
      # 硬门 2 的配套断言：跳过不算绿——直接解析 surefire XML，要求 landlock 与
      # docker 容器 e2e「跑了且没跳过」（比数 count 稳：同文件里 mac/OS 门用例在
      # linux 上本就该跳；docker 六条只在 POSIX 宿主承诺——linux 侧必须真跑）。
      - name: "Assert the landlock and docker e2e legs really ran (no silent skip)"
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          legs = [
              ("sandbox/local/target/surefire-reports/TEST-io.javanatic.harness.sandbox.local.SandboxLocalTest.xml",
               {"landlockReadOnlyDeniesRealWriteWithDialectMarker",
                "landlockWorkspaceWriteAllowsInsideAndDeniesOutside",
                "landlockDevNullWriteIsMeasuredForAdjudication"}),
              ("shell/docker/target/surefire-reports/TEST-io.javanatic.harness.shell.docker.DockerShellTest.xml",
               {"mountSurfaceMatrixWorkspaceWriteAndReadOnly",
                "dangerModeOpensContainerRootAndWorkspace",
                "timeoutKillsInContainerProcessGroup",
                "abortKillsInContainerProcessGroup",
                "concurrencyPairedAndCreateOnce",
                "scopeCloseRemovesContainersAcrossWorkspaces"}),
          ]
          for report, want in legs:
              root = ET.parse(report).getroot()
              ran = {c.get("name") for c in root.iter("testcase")}
              skipped = {c.get("name") for c in root.iter("testcase") if c.find("skipped") is not None}
              missing = sorted(want - ran)
              if missing or (want & skipped):
                  sys.exit(f"leg not really run in {report}: missing={missing} skipped={sorted(want & skipped)}")
              print("leg ran for real:", report, "->", ", ".join(sorted(want)))
          PY
      # dist 镜像冒烟（it13）：jlink 产物直接可跑——help 纯 CLI、verify 全组合 boot。
      # it24 补断言：bwrap 门上过真强制后，沙箱落点必须是点名 bwrap 的 INFO 行
      # （S-b 输出契约的 linux 第一候选侧；落第二候选的情形由容器冒烟与 landlock 门盖）。
      - name: Smoke jlink image
        run: |
          set -o pipefail
          ./dist/jh/target/jlink-image/bin/jh --help
          ./dist/jh/target/jlink-image/bin/jh --verify 2>&1 | tee "$RUNNER_TEMP/jh-verify-host.txt"
          grep -Fq 'sandbox: confining policy "workspace-write" is enforced by backend "bwrap" (enforcement FULL)' \
            "$RUNNER_TEMP/jh-verify-host.txt"
      # 归档冒烟（it24 验收①）：干净 Linux 环境解压即跑——ubuntu:24.04 容器内无 Maven、
      # 无 JDK、PATH 无 bwrap，只凭归档自带运行时跑 --help/--verify。断言诊断如实点名
      # 「bwrap probe failed」＝链第 2 候选的现实形态登记（NixOS / 精简镜像这类宿主
      # bwrap 不在 PATH），容器内 landlock 能否用由 --verify 原样印出（不预设，看日志）。
      - name: Archive smoke in a clean container (ubuntu:24.04)
        run: |
          archive=$(ls dist/jh/target/javanatic-harness-*-linux-*.tar.gz)
          name=$(basename "$archive")
          dir=${name%.tar.gz}
          docker run --rm -v "$PWD/dist/jh/target:/drop:ro" -w /tmp ubuntu:24.04 sh -eu -c "
            tar xzf /drop/$name
            ./$dir/bin/jh --help
            ./$dir/bin/jh --verify > /tmp/verify.txt 2>&1
            if command -v bwrap > /dev/null; then echo 'unexpected: bwrap present in the clean container'; exit 1; fi
            grep -F 'bwrap probe failed' /tmp/verify.txt
            grep -E 'sandbox(:| warning:) confining policy' /tmp/verify.txt
          "
      # Linux 归档取件（it24 验收①）：Release 附件自动化点名推迟 it25，本迭代先由 CI 供下载
      - uses: actions/upload-artifact@v4
        with:
          name: javanatic-harness-linux-amd64
          path: |
            dist/jh/target/javanatic-harness-*-linux-*.tar.gz
            dist/jh/target/javanatic-harness-*-linux-*.zip
          if-no-files-found: error
      # 外部消费方示例（it23）：候选腿 = 工作树 install 进隔离仓 → 示例编译 + 治理自证
      # 运行 + 四负例；脚本自持全部步骤（与本地证据同一入口，位置参数取 candidate）。
      # 隔离仓每跑每新 ⇒ 只凭坐标真解析。发布腿不进 CI（公网依赖不作门禁，B 裁决）。
      - name: Verify external consumer sample (candidate leg)
        run: CONSUMER_WORK="$RUNNER_TEMP/consumer-sample" integration/verify-consumer.sh candidate
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # seatbelt 真强制 e2e（SandboxLocalTest / ShellToolEndToEndTest 的 MAC 用例与全 reactor 同跑）
      - name: Build and test
        run: mvn -B -ntp package
      # dist 镜像冒烟（it13）：jlink 产物直接可跑——help 纯 CLI、verify 全组合 boot
      - name: Smoke jlink image
        run: |
          ./dist/jh/target/jlink-image/bin/jh --help
          ./dist/jh/target/jlink-image/bin/jh --verify
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # validate 阶段内置 spotless:check + checkstyle:check，与本地 pre-push 同口径；
      # 测试平台分区（S-b/S-c）后全 reactor 在 Windows 可跑：Windows 腿真跑，POSIX 腿按
      # @EnabledOnOs 跳——含 shell/docker 容器 e2e 六条（台账「不做 Windows 容器」；
      # windows-latest 有 daemon 无镜像，装载即 fail-loud——四跑实证）与 mac-only 用例；
      # 跳过面由下面两条断言步兜底（防静默绿）。
      - name: Build and test
        run: mvn -B -ntp package
      # 前置硬门（S-c）：windows-acl 助手必须在本 runner 上真跑通——同 bwrap/landlock
      # 门之理，否则 Windows 腿的 e2e（真拒写 → sandboxDenied 命中）会静默跳过。
      # 走 jlink 镜像的模块形态真跑助手 --probe（真建低完整性令牌 + 真限 + 真拒写）；
      # 诊断行原样入日志，非 0 或缺 ready 行即红（不静默吞）。
      # 实参走数组 splat：pwsh 参数 token 解析会在点号处截断未引号实参（五跑实证 run
      # 36530292970：`-Dstderr.encoding=UTF-8` → `-Dstderr` + `.encoding=UTF-8`，后者被
      # java 当主类）；数组元素是已解析字符串，不再过令牌解析。与 ubuntu 孪生步（bash，
      # 同参数同语义）一致；AGENTS.md 已知坑有记。
      - name: "Pre-flight sandbox probe (windows-acl: runnable and denying)"
        shell: pwsh
        run: |
          $img = "dist/jh/target/jlink-image"
          $probeArgs = @(
            '-XX:-UsePerfData',
            '-Dstderr.encoding=UTF-8',
            '--enable-native-access=io.javanatic.harness.sandbox.local',
            '-m', 'io.javanatic.harness.sandbox.local/io.javanatic.harness.sandbox.local.WindowsAclExecMain',
            '--probe'
          )
          & "$img/bin/java.exe" @probeArgs 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-acl-probe.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-Content -Raw "$env:RUNNER_TEMP/windows-acl-probe.txt"
          if ($probe -notmatch 'windows-acl: ready' -or $probe -notmatch 'PARTIAL') {
            Write-Error "probe did not report windows-acl ready/PARTIAL"
            exit 1
          }
      # 硬门配套断言（同 ubuntu job 之理）：跳过不算绿——直接解析 surefire XML，要求
      # Windows 腿「跑了且没跳过」。MAC/LINUX 门用例（win32ChainReportsReady... /
      # helperProbeOffWindows... 等）在 Windows 本就该跳，不列入。
      - name: "Assert the windows-acl e2e leg really ran (no silent skip)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legs = @(
            @{ report = 'sandbox/local/target/surefire-reports/TEST-io.javanatic.harness.sandbox.local.SandboxLocalTest.xml'
               want = @('windowsAclCommandDeniedOutsideStillMarksSandboxDenied',
                        'realWindowsAclReportsReadyWithPartialEnforcement') },
            @{ report = 'sandbox/local/target/surefire-reports/TEST-io.javanatic.harness.sandbox.local.WindowsAclTest.xml'
               want = @('helperProbeOnWindowsSpeaksOnlyProtocolVerdicts',
                        'readOnlyRunDeniesWriteOutsideTheLabeledSurface',
                        'workspaceWriteRunAdmitsInsideAndDeniesOutside',
                        'stdioPassesThroughToTheLowIntegrityChild',
                        'innerQuotesSurviveTheTwoHopQuoting',
                        'childExitCodePropagatesUnchanged',
                        'sessionTempIsARedirectedPrivateDirUnderTheGivenParent') },
            @{ report = 'shell/local/target/surefire-reports/TEST-io.javanatic.harness.shell.local.LocalShellExecutorWindowsTest.xml'
               want = @('capturesStdoutStderrExitCodeAndDuration',
                        'envIsPassedThrough',
                        'timeoutKillsProcessTreeFast',
                        'cancelKillsProcessTreeIncludingGrandchildren',
                        'confiningRequestWithoutProviderFailsClosed') }
          )
          foreach ($leg in $legs) {
            if (-not (Test-Path $leg.report)) { Write-Error "missing surefire report: $($leg.report)"; exit 1 }
            $doc = [xml](Get-Content -Raw $leg.report)
            $ran = @($doc.SelectNodes('//testcase') | ForEach-Object { $_.GetAttribute('name') })
            $skipped = @($doc.SelectNodes('//testcase[skipped]') | ForEach-Object { $_.GetAttribute('name') })
            $missing = @($leg.want | Where-Object { $ran -notcontains $_ })
            $skips = @($leg.want | Where-Object { $skipped -contains $_ })
            if ($missing.Count -or $skips.Count) {
              Write-Error "windows-acl leg not really run in $($leg.report): missing=$($missing -join ',') skipped=$($skips -join ',')"
              exit 1
            }
            Write-Host "windows-acl leg ran for real: $($leg.want.Count) case(s) in $($leg.report)"
          }
      # dist 镜像冒烟（S-c）：jlink 产物直接可跑——help 纯 CLI、verify 全组合 boot，
      # 并断言沙箱落点是点名 windows-acl 的 enforcement PARTIAL 行（S-b 输出契约的
      # Windows 侧；JUL 日志落 stderr ⇒ 必须 2>&1 合流捕获，VM 取证现象同此）。
      - name: Smoke jlink image
        shell: pwsh
        run: |
          & ./dist/jh/target/jlink-image/bin/jh.bat --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/jh/target/jlink-image/bin/jh.bat --verify 2>&1 | Tee-Object "$env:RUNNER_TEMP/jh-verify-host.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/jh-verify-host.txt" -SimpleMatch 'sandbox: confining policy "workspace-write" is enforced by backend "windows-acl" (enforcement PARTIAL)' -Quiet)) {
            Write-Error "jlink verify did not report the windows-acl enforcement line"
            exit 1
          }
      # 归档冒烟（S-c 验收）：解压即跑——只凭归档自带运行时跑 --help/--verify，
      # 与 jlink 镜像冒烟同口径断言 windows-acl 落点行（Linux 侧对应步见 build job）。
      - name: Archive smoke (zip expands and runs)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/jh/target/javanatic-harness-*-windows-*.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "windows archive zip not found"; exit 1 }
          $dest = "$env:RUNNER_TEMP/jh-archive"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $dist = Get-ChildItem $dest -Directory | Select-Object -First 1
          & "$($dist.FullName)/bin/jh.bat" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$($dist.FullName)/bin/jh.bat" --verify 2>&1 | Tee-Object "$env:RUNNER_TEMP/jh-verify-archive.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/jh-verify-archive.txt" -SimpleMatch 'sandbox: confining policy "workspace-write" is enforced by backend "windows-acl" (enforcement PARTIAL)' -Quiet)) {
            Write-Error "archive verify did not report the windows-acl enforcement line"
            exit 1
          }
      # Windows 归档取件（S-c 验收）：同 linux 之理，本迭代先由 CI 供下载
      - uses: actions/upload-artifact@v4
        with:
          name: javanatic-harness-windows-amd64
          path: |
            dist/jh/target/javanatic-harness-*-windows-*.zip
            dist/jh/target/javanatic-harness-*-windows-*.tar.gz
          if-no-files-found: error
  # aarch64 发布件事实源（it25.1 aarch64 裁决·选 2）：双 arch CI job 各出一件，同一事实源；
  # VM 手工产物降级为证据引用、永不作发布件（不可 CI 复现的产物不进发布面）。
  # 镜像 windows 腿八步，三个 arch 特异点预先在案：
  # ① setup-java 需 architecture: aarch64（temurin 有 windows-aarch64 JDK 25——ARM64 VM 已证产品面）；
  # ② 归档名由 dist/jh 的 windows-${os.arch} profile（pom.xml:142）自动得 windows-aarch64，与 VM
  #    命名一致；归档冒烟与上传通配钉死 -windows-aarch64- 面——若运行时是 x64 JDK（镜像漂移/仿真），
  #    jlink 会产出 amd64 件，通配失配即 fail loud，不会以 aarch64 名义混入发布面；
  # ③ 容器 e2e 已 POSIX 门（docker 面零涉——不预置、不跑）；pwsh 7 为镜像自带（ARM64 原生）。
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
          cache: maven
      # validate 阶段内置 spotless:check + checkstyle:check，与本地 pre-push 同口径；
      # 测试平台分区与 windows 腿一致：Windows 腿真跑，POSIX 腿按 @EnabledOnOs 跳——
      # 含 shell/docker 容器 e2e 六条（台账「不做 Windows 容器」）与 mac-only 用例；
      # 跳过面由下面两条断言步兜底（防静默绿）。
      - name: Build and test
        run: mvn -B -ntp package
      # 前置硬门：windows-acl 助手必须在本 runner 上真跑通——同 windows 腿之理，否则
      # Windows 腿的 e2e（真拒写 → sandboxDenied 命中）会静默跳过。走 jlink 镜像的模块
      # 形态真跑助手 --probe（真建低完整性令牌 + 真限 + 真拒写）；诊断行原样入日志，
      # 非 0 或缺 ready 行即红（不静默吞）。实参走数组 splat：pwsh 参数 token 解析会在
      # 点号处截断未引号实参（五跑实证 run 36530292970；AGENTS.md 已知坑有记）。
      - name: "Pre-flight sandbox probe (windows-acl: runnable and denying)"
        shell: pwsh
        run: |
          $img = "dist/jh/target/jlink-image"
          $probeArgs = @(
            '-XX:-UsePerfData',
            '-Dstderr.encoding=UTF-8',
            '--enable-native-access=io.javanatic.harness.sandbox.local',
            '-m', 'io.javanatic.harness.sandbox.local/io.javanatic.harness.sandbox.local.WindowsAclExecMain',
            '--probe'
          )
          & "$img/bin/java.exe" @probeArgs 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-acl-probe.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-Content -Raw "$env:RUNNER_TEMP/windows-acl-probe.txt"
          if ($probe -notmatch 'windows-acl: ready' -or $probe -notmatch 'PARTIAL') {
            Write-Error "probe did not report windows-acl ready/PARTIAL"
            exit 1
          }
      # 硬门配套断言（同 windows 腿之理）：跳过不算绿——直接解析 surefire XML，要求
      # Windows 腿「跑了且没跳过」。MAC/LINUX 门用例在 Windows 本就该跳，不列入。
      - name: "Assert the windows-acl e2e leg really ran (no silent skip)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legs = @(
            @{ report = 'sandbox/local/target/surefire-reports/TEST-io.javanatic.harness.sandbox.local.SandboxLocalTest.xml'
               want = @('windowsAclCommandDeniedOutsideStillMarksSandboxDenied',
                        'realWindowsAclReportsReadyWithPartialEnforcement') },
            @{ report = 'sandbox/local/target/surefire-reports/TEST-io.javanatic.harness.sandbox.local.WindowsAclTest.xml'
               want = @('helperProbeOnWindowsSpeaksOnlyProtocolVerdicts',
                        'readOnlyRunDeniesWriteOutsideTheLabeledSurface',
                        'workspaceWriteRunAdmitsInsideAndDeniesOutside',
                        'stdioPassesThroughToTheLowIntegrityChild',
                        'innerQuotesSurviveTheTwoHopQuoting',
                        'childExitCodePropagatesUnchanged',
                        'sessionTempIsARedirectedPrivateDirUnderTheGivenParent') },
            @{ report = 'shell/local/target/surefire-reports/TEST-io.javanatic.harness.shell.local.LocalShellExecutorWindowsTest.xml'
               want = @('capturesStdoutStderrExitCodeAndDuration',
                        'envIsPassedThrough',
                        'timeoutKillsProcessTreeFast',
                        'cancelKillsProcessTreeIncludingGrandchildren',
                        'confiningRequestWithoutProviderFailsClosed') }
          )
          foreach ($leg in $legs) {
            if (-not (Test-Path $leg.report)) { Write-Error "missing surefire report: $($leg.report)"; exit 1 }
            $doc = [xml](Get-Content -Raw $leg.report)
            $ran = @($doc.SelectNodes('//testcase') | ForEach-Object { $_.GetAttribute('name') })
            $skipped = @($doc.SelectNodes('//testcase[skipped]') | ForEach-Object { $_.GetAttribute('name') })
            $missing = @($leg.want | Where-Object { $ran -notcontains $_ })
            $skips = @($leg.want | Where-Object { $skipped -contains $_ })
            if ($missing.Count -or $skips.Count) {
              Write-Error "windows-acl leg not really run in $($leg.report): missing=$($missing -join ',') skipped=$($skips -join ',')"
              exit 1
            }
            Write-Host "windows-acl leg ran for real: $($leg.want.Count) case(s) in $($leg.report)"
          }
      # dist 镜像冒烟：同 windows 腿口径——help 纯 CLI、verify 全组合 boot，断言沙箱落点
      # 是点名 windows-acl 的 enforcement PARTIAL 行（JUL 日志落 stderr ⇒ 2>&1 合流捕获）。
      - name: Smoke jlink image
        shell: pwsh
        run: |
          & ./dist/jh/target/jlink-image/bin/jh.bat --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/jh/target/jlink-image/bin/jh.bat --verify 2>&1 | Tee-Object "$env:RUNNER_TEMP/jh-verify-host.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/jh-verify-host.txt" -SimpleMatch 'sandbox: confining policy "workspace-write" is enforced by backend "windows-acl" (enforcement PARTIAL)' -Quiet)) {
            Write-Error "jlink verify did not report the windows-acl enforcement line"
            exit 1
          }
      # 归档冒烟：同 windows 腿口径；zip 通配钉 windows-aarch64（job 注释 ②——防错架构件）
      - name: Archive smoke (zip expands and runs)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/jh/target/javanatic-harness-*-windows-aarch64.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "windows-aarch64 archive zip not found"; exit 1 }
          $dest = "$env:RUNNER_TEMP/jh-archive"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $dist = Get-ChildItem $dest -Directory | Select-Object -First 1
          & "$($dist.FullName)/bin/jh.bat" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$($dist.FullName)/bin/jh.bat" --verify 2>&1 | Tee-Object "$env:RUNNER_TEMP/jh-verify-archive.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/jh-verify-archive.txt" -SimpleMatch 'sandbox: confining policy "workspace-write" is enforced by backend "windows-acl" (enforcement PARTIAL)' -Quiet)) {
            Write-Error "archive verify did not report the windows-acl enforcement line"
            exit 1
          }
      # aarch64 归档取件（it25.1 裁决：双 job 收件构成 Release 附件事实源）
      - uses: actions/upload-artifact@v4
        with:
          name: javanatic-harness-windows-aarch64
          path: |
            dist/jh/target/javanatic-harness-*-windows-aarch64.zip
            dist/jh/target/javanatic-harness-*-windows-aarch64.tar.gz
          if-no-files-found: error
