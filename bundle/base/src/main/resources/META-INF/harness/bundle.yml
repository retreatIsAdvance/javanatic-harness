# base bundle——每个 profile 的首层(07 §1)。行引用插件 id(ServiceLoader 发现);
# 安全边界值(root/workspace)在此显式给出,profile patch 可整行替换。
name: base
description: First layer of every profile
rows:
  - plugin: session-store
  - plugin: persistence-jsonl
    config:
      root: ${home}/.harness/sessions
  - plugin: agents
  - plugin: loop-guard
  - plugin: system-prompt
  - plugin: llm
  - plugin: llm-openai-compat
    config:
      name: deepseek
      baseUrl: ${env:DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    disabled: ${env:DEEPSEEK_API_KEY} == null
  - plugin: approval-auto
  - plugin: approval-ask
    disabled: true
  - plugin: approval-deny
    disabled: true
  - plugin: tools
  # plan 行须在 sandbox-policy 之前(其 requires 含 plan);todo 顺序无约束,就近放工具旁
  - plugin: plan
    config:
      section: |
        Plan mode is active: research and plan only, do not execute yet. Investigate
        with read-only tools (fs_read, fs_list, fs_search; shell for inspection only) and think
        the task through. Use ask_user when a plan-blocking decision belongs to the user.
        When the plan is complete, present it with exit_plan_mode
        as markdown starting with a # heading; on approval, carry it out step by step.
        File-effect restriction is enforced by the sandbox layer (read-only while
        planning); this section states the discipline, the sandbox guarantees it.
  # 沙箱平台链:darwin=seatbelt、linux=bwrap(it12.7;需主机装 bubblewrap,非特权
  # userns 被禁的主机受限档 fail-closed)、win32=空链(windows-acl 入 0.2.0)。
  # macOS/Linux 开箱可用;Windows 部署在 0.2.0 前需显式 overlay
  # mode: danger-full-access(显式弃权,非默认)
  - plugin: sandbox-local
  - plugin: sandbox-policy
    config:
      mode: workspace-write
      workspace: ${cwd}
  - plugin: fs-local
    config:
      root: ${cwd}
  - plugin: fs-tool
  - plugin: shell-bash-local
  # 环境级隔离(备选 ShellExecutor,与 shell-bash-local 互斥;同 scope 双启用由 kernel fail loud)
  # 启用需显式选择:headless --docker/--image= 或 profile overlay;镜像须本机在场(不自动拉取)
  - plugin: shell-docker
    disabled: true
  - plugin: shell-tool
    config:
      workspace: ${cwd}
      timeoutSeconds: 60
  # 单 agent 顺序工作——并行 in_progress 需 subagent/workflow 场景再开
  - plugin: todo
    config:
      allowParallelInProgress: false
  # 澄清问答（it22）：ask_user 免审批（提问不是副作用）+ 停轮结果（答复 = 下一轮
  # user message）；行序无约束，就近工具面
  - plugin: ask-user
  # 命令面注册表(it14,REPL 用):具体命令由交互适配器注册;requires 为空,顺序无约束
  - plugin: commands
  - plugin: presets
  - plugin: compaction
    # 上下文窗口是模型属性,base 不猜数——启用需 overlay 给 contextWindow(或 maxContextTokens)
    disabled: true
  - plugin: agent-loop
    config:
      # 工作区单源(it21):与 fs-local.root / shell-tool.workspace / sandbox-policy.workspace
      # 同值——提示词 cwd 与三处围栏由 AppBoot 装配期断言绑定,漂移 fail loud
      cwd: ${cwd}
