# base bundle——每个 profile 的首层(07 §1)。行引用插件 id(ServiceLoader 发现);
# 安全边界值(root/workspace)在此显式给出,profile patch 可整行替换。
name: base
description: First layer of every profile
rows:
  - plugin: session-store
  - plugin: persistence-jsonl
    config:
      root: ${home}/.harness/sessions
  - plugin: agents
  - plugin: loop-guard
  - plugin: system-prompt
  - plugin: llm
  - plugin: llm-openai-compat
    config:
      name: deepseek
      baseUrl: ${env:DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    disabled: ${env:DEEPSEEK_API_KEY} == null
  - plugin: approval-auto
  - plugin: approval-ask
    disabled: true
  - plugin: approval-deny
    disabled: true
  - plugin: tools
  - plugin: fs-local
    config:
      root: ${cwd}
  - plugin: fs-tool
  - plugin: shell-bash-local
  - plugin: shell-tool
    config:
      workspace: ${cwd}
      timeoutSeconds: 60
  - plugin: todo
    # 单 agent 顺序工作——并行 in_progress 需 subagent/workflow 场景再开
    config:
      allowParallelInProgress: false
  - plugin: plan
    config:
      section: |
        Plan mode is active: research and plan only, do not execute yet. Investigate
        with read-only tools (fs_read, fs_list; shell for inspection only) and think
        the task through. When the plan is complete, present it with exit_plan_mode
        as markdown starting with a # heading; on approval, carry it out step by step.
        This guidance is advisory in this deployment — side-effect restriction is
        enforced by the sandbox layer, not by this section.
  - plugin: presets
  - plugin: compaction
    # 上下文窗口是模型属性,base 不猜数——启用需 overlay 给 contextWindow(或 maxContextTokens)
    disabled: true
  - plugin: agent-loop
